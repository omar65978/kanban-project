<aside class="sidebar" [class.hidden]="!visible">
  <div class="sidebar-inner">

    <!-- Logo -->
    <div class="logo">
      @if (isDark$ | async) {
        <img src="assets/logo-light.svg" alt="Kanban" class="logo-full">
      } @else {
        <img src="assets/logo-dark.svg" alt="Kanban" class="logo-full">
      }
      <img src="assets/logo-mobile.svg" alt="Kanban" class="logo-mobile">
    </div>

    <!-- Board list -->
    <nav class="boards-nav">
      <h4 class="nav-heading">
        All Boards ({{ (boards$ | async)?.length ?? 0 }})
      </h4>

      <ul class="board-list">
        @for (board of (boards$ | async); track board.id) {
          <li>
            <button
              class="board-item"
              [class.active]="board.id === (activeBoard$ | async)?.id"
              (click)="selectBoard(board.id)">
              <img src="assets/icon-board.svg" alt="" class="board-icon">
              <span>{{ board.name }}</span>
            </button>
          </li>
        }

        <li>
          <button class="board-item create-board" (click)="openAddBoard()">
            <img src="assets/icon-board.svg" alt="" class="board-icon">
            <span>+ Create New Board</span>
          </button>
        </li>
      </ul>
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
      <!-- Theme toggle -->
      <div class="theme-toggle">
        <img src="assets/icon-light-theme.svg" alt="Light">
        <button
          class="toggle-track"
          [class.dark]="isDark$ | async"
          (click)="toggleTheme()"
          [attr.aria-label]="(isDark$ | async) ? 'Switch to light mode' : 'Switch to dark mode'">
          <span class="toggle-thumb"></span>
        </button>
        <img src="assets/icon-dark-theme.svg" alt="Dark">
      </div>

      <!-- Hide sidebar -->
      <button class="hide-sidebar-btn" (click)="hideSidebar()">
        <img src="assets/icon-hide-sidebar.svg" alt="">
        <span>Hide Sidebar</span>
      </button>
    </div>
  </div>
</aside>
